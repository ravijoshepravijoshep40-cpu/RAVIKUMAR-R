<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicCraft — AI Comic Story Creator</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="hero-bg">
  <main class="container">
    <section class="hero">
      <div class="badge">✨ GEMINI + STABLE DIFFUSION</div>
      <h1>Comic<span>Craft</span></h1>
      <p>Turn one idea into a complete 5-panel AI comic.</p>
    </section>

    {% if error %}
      <div class="alert error">{{ error }}</div>
    {% endif %}

    <section class="card form-card">
      <form action="/generate" method="post">
        <label for="story_prompt">Story Prompt</label>
        <textarea id="story_prompt" name="story_prompt" rows="5" required
          placeholder="Example: A brave fox exploring an enchanted forest..."></textarea>

        <div class="grid">
          <div>
            <label for="character_name">Main Character Name</label>
            <input id="character_name" name="character_name" required placeholder="Alex">
          </div>
          <div>
            <label for="setting">Setting</label>
            <select id="setting" name="setting">
              <option>Forest</option>
              <option>School</option>
              <option>Space</option>
              <option>City</option>
              <option>Fantasy Kingdom</option>
              <option>Custom</option>
            </select>
          </div>
          <div>
            <label for="tone">Story Tone</label>
            <select id="tone" name="tone">
              <option>Light-hearted</option>
              <option>Dramatic</option>
              <option>Poetic</option>
              <option>Funny</option>
              <option>Adventure</option>
            </select>
          </div>
          <div>
            <label for="art_style">Art Style</label>
            <select id="art_style" name="art_style">
              <option>Anime</option>
              <option>Pixel Art</option>
              <option>Comic Book</option>
              <option>Realistic</option>
              <option>Watercolor</option>
            </select>
          </div>
        </div>

        <button class="primary-btn" type="submit">🚀 Generate My Comic</button>
      </form>
    </section>

    <section class="features">
      <div><strong>01</strong><span>Gemini outline</span></div>
      <div><strong>02</strong><span>Gemini story</span></div>
      <div><strong>03</strong><span>AI illustrations</span></div>
      <div><strong>04</strong><span>PDF export</span></div>
    </section>
  </main>
</body>
</html>
